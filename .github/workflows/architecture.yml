# The architecture check, run on every push and every pull request. It is the
# same two commands as locally, from a fresh checkout: an import that reaches
# past a package's public surface, or a cycle between packages, fails the run.
#
# This workflow reports; it does not require. Making a check required is a
# branch-protection setting of a repository, not something a branch can carry.
name: Architecture

on: [push, pull_request]

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Both actions are pinned to an exact release: setup-uv stopped publishing
      # a floating major tag after v7.6, and a tag that can vanish is not a pin.
      # No python-version here -- setup-uv reads `.python-version`, so the
      # interpreter stays declared in one place.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --frozen: the run resolves nothing. It installs what uv.lock pins, so a
      # green run here means the same versions a contributor has locally.
      - name: Install the project and its dev tools
        run: uv sync --frozen

      # tach reads the import graph statically; no application code is imported
      # and no .env is needed, so the run touches neither database nor network.
      - name: No private name reached from outside its package
        run: uv run tach check

      - name: No import cycle between packages
        run: uv run python scripts/check_cycles.py

  # On a push to `staging` or `production` alone, once `architecture` has
  # passed: build this commit's image, unless an earlier push already did, push
  # it to GHCR, then ask that branch's VM to deploy it, through the VM's HTTPS
  # URL, in a request signed with its DEPLOY_SECRET. Each branch deploys to the
  # GitHub environment of its name, which holds DEPLOY_URL and DEPLOY_SECRET.
  deploy:
    name: deploy
    needs: architecture
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One deploy at a time per environment, in the order pushed; a newer push
    # waiting replaces an older one waiting.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7.0.1

      # A commit pushed to `staging`, then to `production`, is built once:
      # production runs the very image staging ran.
      - name: Build and push the image, unless it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build -t "$image" .
            docker push "$image"
          fi

      - name: Deploy it on the VM
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          body="{\"sha\":\"$GITHUB_SHA\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" | awk '{print $NF}')
          curl -sS --fail-with-body --max-time 300 -X POST "$DEPLOY_URL/hooks/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: sha256=$signature" \
            -d "$body"
