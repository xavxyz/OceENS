name: Package structure

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - run: uv sync --locked
      - name: Private names stay inside their package
        run: uv run tach check
      - name: No import found through the working directory
        run: uv run tach check-external
      - name: No import cycle between packages
        run: uv run python scripts/check_cycles.py
      - name: No sys.path manipulation
        run: |
          if grep -rn "sys\.path" src; then
            echo "Imports resolve through the oceens package, not sys.path."
            exit 1
          fi
